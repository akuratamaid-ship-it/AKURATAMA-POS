<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>AKURATAMA POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','sans-serif'] },
      colors: {
        brand: { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a' },
        dark: { 800:'#1e293b',900:'#0f172a',950:'#020617' }
      }
    }
  }
}
</script>
<style>
* { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { overscroll-behavior: none; background: #0f172a; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
@keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
.animate-fade-up { animation: fadeUp 0.3s ease-out forwards; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
.glass { background: rgba(30,41,59,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.card-hover { transition: all 0.2s ease; }
.card-hover:active { transform: scale(0.97); }
input:focus { outline: none; }
@media print {
  body * { visibility: hidden !important; }
  #receipt-print, #receipt-print * { visibility: visible !important; }
  #receipt-print { position: fixed; left: 0; top: 0; width: 80mm; background: white !important; color: black !important; padding: 8px; }
  .no-print { display: none !important; }
}
</style>
</head>
<body class="bg-dark-900 text-white antialiased">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ============ UTILS ============
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = (n) => new Intl.NumberFormat('id-ID').format(Math.round(n));
const nowTime = () => new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const todayDate = () => new Date().toISOString().split('T')[0];
const nowISO = () => new Date().toISOString();
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

const KEYS = {
  products: 'akv3:products',
  transactions: 'akv3:transactions',
  cart: 'akv3:cart',
  settings: 'akv3:settings',
  held: 'akv3:held',
  shifts: 'akv3:shifts',
  activeShift: 'akv3:activeShift',
};

// ============ SAMPLE DATA ============
const SAMPLE_PRODUCTS = [
  { id: uid(), name: 'Beras Premium 5kg', price: 65000, cost: 55000, stock: 24, category: 'Sembako' },
  { id: uid(), name: 'Minyak Goreng 2L', price: 28000, cost: 24000, stock: 36, category: 'Sembako' },
  { id: uid(), name: 'Gula Pasir 1kg', price: 14500, cost: 12000, stock: 50, category: 'Sembako' },
  { id: uid(), name: 'Telur Ayam 1kg', price: 27000, cost: 23000, stock: 18, category: 'Sembako' },
  { id: uid(), name: 'Indomie Goreng', price: 3500, cost: 3000, stock: 120, category: 'Makanan' },
  { id: uid(), name: 'Kopi Kapal Api', price: 12000, cost: 10000, stock: 45, category: 'Minuman' },
  { id: uid(), name: 'Sabun Lifebuoy', price: 5500, cost: 4500, stock: 60, category: 'Kebutuhan' },
  { id: uid(), name: 'Shampoo Clear', price: 8500, cost: 7000, stock: 40, category: 'Kebutuhan' },
  { id: uid(), name: 'Tissue Paseo', price: 11000, cost: 9000, stock: 30, category: 'Kebutuhan' },
  { id: uid(), name: 'Aqua 600ml', price: 4000, cost: 3200, stock: 72, category: 'Minuman' },
  { id: uid(), name: 'Chitato 68g', price: 9500, cost: 8000, stock: 28, category: 'Makanan' },
  { id: uid(), name: 'Beng-beng', price: 2500, cost: 2000, stock: 80, category: 'Makanan' },
];

const CATEGORIES = ['Semua','Sembako','Makanan','Minuman','Kebutuhan'];

// ============ APP ============
function App() {
  const [tab, setTab] = useState('kasir');
  const [products, setProducts] = useState(() => {
    const saved = LS.get(KEYS.products, []);
    if (saved.length === 0) { LS.set(KEYS.products, SAMPLE_PRODUCTS); return SAMPLE_PRODUCTS; }
    return saved;
  });
  const [cart, setCart] = useState(() => LS.get(KEYS.cart, []));
  const [transactions, setTransactions] = useState(() => LS.get(KEYS.transactions, []));
  const [held, setHeld] = useState(() => LS.get(KEYS.held, []));
  const [settings, setSettings] = useState(() => LS.get(KEYS.settings, { store:'AKURATAMA', address:'', phone:'' }));
  const [activeShift, setActiveShift] = useState(() => LS.get(KEYS.activeShift, null));
  const [shifts, setShifts] = useState(() => LS.get(KEYS.shifts, []));
  const [receipt, setReceipt] = useState(null);
  const [showOpenShift, setShowOpenShift] = useState(false);
  const [showCloseShift, setShowCloseShift] = useState(false);
  const [showShiftReport, setShowShiftReport] = useState(null);

  useEffect(() => { LS.set(KEYS.products, products); }, [products]);
  useEffect(() => { LS.set(KEYS.cart, cart); }, [cart]);
  useEffect(() => { LS.set(KEYS.transactions, transactions); }, [transactions]);
  useEffect(() => { LS.set(KEYS.held, held); }, [held]);
  useEffect(() => { LS.set(KEYS.settings, settings); }, [settings]);
  useEffect(() => { LS.set(KEYS.activeShift, activeShift); }, [activeShift]);
  useEffect(() => { LS.set(KEYS.shifts, shifts); }, [shifts]);

  const openShift = (employee, startCash) => {
    const shift = {
      id: uid(),
      employee,
      startCash: parseInt(startCash) || 0,
      startTime: nowISO(),
      startDate: todayDate(),
      isActive: true,
    };
    setActiveShift(shift);
    setShowOpenShift(false);
  };

  const closeShift = (actualCash) => {
    if (!activeShift) return;
    const shiftTx = transactions.filter(t => new Date(t.date + 'T' + t.time) >= new Date(activeShift.startTime));
    const totalSales = shiftTx.reduce((s, t) => s + t.total, 0);
    const totalProfit = shiftTx.reduce((s, t) => s + t.items.reduce((is, i) => is + ((i.price - (i.cost||0)) * i.qty), 0), 0);
    const expectedCash = activeShift.startCash + totalSales;
    const diff = parseInt(actualCash) - expectedCash;

    const closedShift = {
      ...activeShift,
      endTime: nowISO(),
      endDate: todayDate(),
      isActive: false,
      totalSales,
      totalProfit,
      transactionCount: shiftTx.length,
      expectedCash,
      actualCash: parseInt(actualCash) || 0,
      difference: diff,
      transactions: shiftTx,
    };

    setShifts(prev => [closedShift, ...prev]);
    setActiveShift(null);
    setCart([]);
    setShowCloseShift(false);
    setShowShiftReport(closedShift);
  };

  const addToCart = (p) => {
    setCart(prev => {
      const i = prev.findIndex(c => c.id === p.id);
      if (i >= 0) { const n = [...prev]; n[i].qty += 1; return n; }
      return [...prev, { ...p, qty: 1 }];
    });
  };

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(c => c.id === id ? { ...c, qty: Math.max(1, c.qty + delta) } : c));
  };

  const removeCart = (id) => setCart(prev => prev.filter(c => c.id !== id));
  const clearCart = () => setCart([]);

  const holdOrder = () => {
    if (!cart.length) return;
    const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
    setHeld(prev => [...prev, { id: uid(), items: [...cart], time: nowTime(), total }]);
    setCart([]);
  };

  const restoreHeld = (order) => {
    setCart(order.items);
    setHeld(prev => prev.filter(o => o.id !== order.id));
  };

  const checkout = (payment) => {
    if (!cart.length) return;
    const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const change = payment - total;
    if (change < 0) { alert('Uang kurang!'); return; }
    const tx = { id: uid(), date: todayDate(), time: nowTime(), items: [...cart], total, payment, change };
    setProducts(prev => prev.map(p => {
      const item = cart.find(c => c.id === p.id);
      return item ? { ...p, stock: Math.max(0, p.stock - item.qty) } : p;
    }));
    setTransactions(prev => [tx, ...prev]);
    setReceipt(tx);
    setCart([]);
  };

  const addProduct = (p) => setProducts(prev => [...prev, { ...p, id: uid() }]);
  const updateProduct = (id, u) => setProducts(prev => prev.map(p => p.id === id ? { ...p, ...u } : p));
  const deleteProduct = (id) => { if (confirm('Hapus produk?')) setProducts(prev => prev.filter(p => p.id !== id)); };

  // Shift stats for header
  const shiftStats = useMemo(() => {
    if (!activeShift) return null;
    const shiftTx = transactions.filter(t => new Date(t.date + 'T' + t.time) >= new Date(activeShift.startTime));
    const sales = shiftTx.reduce((s, t) => s + t.total, 0);
    return { sales, count: shiftTx.length };
  }, [activeShift, transactions]);

  return (
    <div className="min-h-screen bg-dark-950 pb-24">
      {/* Header */}
      <header className="sticky top-0 z-40 bg-dark-900/80 backdrop-blur-xl border-b border-slate-800">
        <div className="max-w-lg mx-auto px-4 py-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div>
                <h1 className="font-bold text-white text-base leading-tight">AKURATAMA</h1>
                <p className="text-[10px] text-slate-400">POS Offline</p>
              </div>
            </div>
            <div className="text-right">
              {activeShift ? (
                <div>
                  <p className="text-[10px] text-brand-400 font-semibold">🟢 Shift Aktif · {activeShift.employee}</p>
                  <p className="text-[10px] text-slate-400">{shiftStats ? fmt(shiftStats.sales) + ' · ' + shiftStats.count + ' tx' : '0'}</p>
                </div>
              ) : (
                <p className="text-[10px] text-rose-400 font-semibold">🔴 Shift Tutup</p>
              )}
            </div>
          </div>

          {/* Shift Action Bar */}
          <div className="mt-2.5 flex gap-2">
            {activeShift ? (
              <button onClick={() => setShowCloseShift(true)} className="flex-1 py-2 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-semibold border border-rose-500/20 flex items-center justify-center gap-1.5">
                🔒 Tutup Shift
              </button>
            ) : (
              <button onClick={() => setShowOpenShift(true)} className="flex-1 py-2 rounded-xl bg-brand-500/10 text-brand-400 text-xs font-semibold border border-brand-500/20 flex items-center justify-center gap-1.5">
                🔓 Buka Shift
              </button>
            )}
            <button onClick={() => setTab('shift')} className="px-3 py-2 rounded-xl bg-slate-700/50 text-slate-300 text-xs font-semibold">
              📋 Riwayat Shift
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-lg mx-auto px-4 pt-4">
        {tab === 'kasir' && (
          activeShift ? (
            <Kasir products={products} cart={cart} addToCart={addToCart} updateQty={updateQty} removeCart={removeCart} clearCart={clearCart} holdOrder={holdOrder} held={held} restoreHeld={restoreHeld} checkout={checkout} />
          ) : (
            <div className="flex flex-col items-center justify-center py-20 text-center animate-fade-up">
              <div className="w-20 h-20 rounded-full bg-slate-800 flex items-center justify-center mb-4 text-3xl">🔒</div>
              <h2 className="font-bold text-lg mb-2">Shift Belum Dibuka</h2>
              <p className="text-sm text-slate-400 mb-6 max-w-[260px]">Silakan buka shift terlebih dahulu untuk mulai bertransaksi.</p>
              <button onClick={() => setShowOpenShift(true)} className="px-6 py-3 rounded-xl bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20">
                🔓 Buka Shift Sekarang
              </button>
            </div>
          )
        )}
        {tab === 'produk' && <Produk products={products} addProduct={addProduct} updateProduct={updateProduct} deleteProduct={deleteProduct} />}
        {tab === 'riwayat' && <Riwayat transactions={transactions} />}
        {tab === 'laporan' && <Laporan transactions={transactions} />}
        {tab === 'shift' && <ShiftHistory shifts={shifts} onViewReport={setShowShiftReport} />}
        {tab === 'pengaturan' && <Pengaturan settings={settings} setSettings={setSettings} products={products} transactions={transactions} setProducts={setProducts} setTransactions={setTransactions} setCart={setCart} setHeld={setHeld} setShifts={setShifts} setActiveShift={setActiveShift} />}
      </main>

      {receipt && <ReceiptModal receipt={receipt} settings={settings} onClose={() => setReceipt(null)} />}
      {showOpenShift && <OpenShiftModal onOpen={openShift} onCancel={() => setShowOpenShift(false)} />}
      {showCloseShift && <CloseShiftModal activeShift={activeShift} shiftStats={shiftStats} onClose={closeShift} onCancel={() => setShowCloseShift(false)} />}
      {showShiftReport && <ShiftReportModal shift={showShiftReport} settings={settings} onClose={() => setShowShiftReport(null)} />}

      {/* Bottom Nav */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 glass border-t border-slate-700/50">
        <div className="max-w-lg mx-auto flex justify-around py-2">
          {[
            {id:'kasir', icon:'🛒', label:'Kasir'},
            {id:'produk', icon:'📦', label:'Produk'},
            {id:'riwayat', icon:'📋', label:'Riwayat'},
            {id:'laporan', icon:'📊', label:'Laporan'},
            {id:'pengaturan', icon:'⚙️', label:'Seting'},
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition ${tab===t.id ? 'text-brand-400' : 'text-slate-500'}`}>
              <span className="text-lg">{t.icon}</span>
              <span className="text-[9px] font-medium">{t.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

// ============ OPEN SHIFT MODAL ============
function OpenShiftModal({ onOpen, onCancel }) {
  const [employee, setEmployee] = useState('');
  const [startCash, setStartCash] = useState('');

  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={onCancel}>
      <div className="bg-dark-900 rounded-3xl border border-slate-700 w-full max-w-sm p-6 animate-fade-up" onClick={e => e.stopPropagation()}>
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-2xl bg-brand-500/10 flex items-center justify-center mx-auto mb-3 text-2xl">🔓</div>
          <h2 className="font-bold text-xl">Buka Shift</h2>
          <p className="text-xs text-slate-400 mt-1">Masukkan data untuk memulai shift</p>
        </div>
        <div className="space-y-4">
          <div>
            <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Nama Karyawan</label>
            <input autoFocus placeholder="Contoh: Budi" value={employee} onChange={e => setEmployee(e.target.value)}
              className="w-full mt-2 px-4 py-3.5 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
          </div>
          <div>
            <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Modal Awal (Kas)</label>
            <input type="number" placeholder="0" value={startCash} onChange={e => setStartCash(e.target.value)}
              className="w-full mt-2 px-4 py-3.5 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
          </div>
        </div>
        <div className="flex gap-3 mt-6">
          <button onClick={onCancel} className="flex-1 py-3.5 rounded-xl bg-slate-700 text-white font-semibold text-sm">Batal</button>
          <button onClick={() => { if(!employee){alert('Nama karyawan wajib diisi!');return;} onOpen(employee, startCash); }}
            className="flex-1 py-3.5 rounded-xl bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20">Buka Shift</button>
        </div>
      </div>
    </div>
  );
}

// ============ CLOSE SHIFT MODAL ============
function CloseShiftModal({ activeShift, shiftStats, onClose, onCancel }) {
  const [actualCash, setActualCash] = useState('');
  const expectedCash = (activeShift?.startCash || 0) + (shiftStats?.sales || 0);

  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={onCancel}>
      <div className="bg-dark-900 rounded-3xl border border-slate-700 w-full max-w-sm p-6 animate-fade-up" onClick={e => e.stopPropagation()}>
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-2xl bg-rose-500/10 flex items-center justify-center mx-auto mb-3 text-2xl">🔒</div>
          <h2 className="font-bold text-xl">Tutup Shift</h2>
          <p className="text-xs text-slate-400 mt-1">{activeShift?.employee} · {activeShift?.startDate}</p>
        </div>

        <div className="bg-dark-800 rounded-2xl p-4 space-y-3 mb-5 border border-slate-700/50">
          <div className="flex justify-between text-sm">
            <span className="text-slate-400">Modal Awal</span>
            <span className="font-medium">{fmt(activeShift?.startCash || 0)}</span>
          </div>
          <div className="flex justify-between text-sm">
            <span className="text-slate-400">Penjualan Shift</span>
            <span className="font-medium text-brand-400">{fmt(shiftStats?.sales || 0)}</span>
          </div>
          <div className="flex justify-between text-sm">
            <span className="text-slate-400">Jumlah Transaksi</span>
            <span className="font-medium">{shiftStats?.count || 0}</span>
          </div>
          <div className="border-t border-slate-700/50 pt-3 flex justify-between text-sm">
            <span className="text-slate-300 font-semibold">Kas Seharusnya</span>
            <span className="font-bold text-white">{fmt(expectedCash)}</span>
          </div>
        </div>

        <div>
          <label className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Kas Aktual (Hitung Fisik)</label>
          <input autoFocus type="number" placeholder="Masukkan jumlah uang di laci" value={actualCash} onChange={e => setActualCash(e.target.value)}
            className="w-full mt-2 px-4 py-3.5 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
        </div>

        {parseInt(actualCash) > 0 && (
          <div className={`mt-3 text-center py-2 rounded-xl text-sm font-semibold ${parseInt(actualCash) === expectedCash ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : parseInt(actualCash) > expectedCash ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}>
            {parseInt(actualCash) === expectedCash ? '✅ Kas sesuai' : parseInt(actualCash) > expectedCash ? '💰 Kas lebih: ' + fmt(parseInt(actualCash) - expectedCash) : '⚠️ Kas kurang: ' + fmt(expectedCash - parseInt(actualCash))}
          </div>
        )}

        <div className="flex gap-3 mt-5">
          <button onClick={onCancel} className="flex-1 py-3.5 rounded-xl bg-slate-700 text-white font-semibold text-sm">Batal</button>
          <button onClick={() => { if(!actualCash){alert('Masukkan kas aktual!');return;} onClose(actualCash); }}
            className="flex-1 py-3.5 rounded-xl bg-rose-500 text-white font-semibold text-sm shadow-lg shadow-rose-500/20">Tutup & Laporan</button>
        </div>
      </div>
    </div>
  );
}

// ============ SHIFT REPORT MODAL ============
function ShiftReportModal({ shift, settings, onClose }) {
  const duration = Math.round((new Date(shift.endTime) - new Date(shift.startTime)) / 60000);
  const hours = Math.floor(duration / 60);
  const mins = duration % 60;

  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 no-print">
      <div className="bg-white rounded-2xl max-w-xs w-full shadow-2xl overflow-hidden animate-fade-up">
        <div id="receipt-print" className="p-5 text-slate-900" style={{fontFamily:'monospace', fontSize:'13px', lineHeight:'1.6'}}>
          <div className="text-center mb-3">
            <p className="font-bold text-base">{settings.store}</p>
            <p className="text-xs text-slate-500">{settings.address}</p>
            <p className="text-xs text-slate-500">{settings.phone}</p>
            <p className="font-bold text-sm mt-2">LAPORAN SHIFT</p>
            <p className="text-xs text-slate-400">{shift.startDate}</p>
          </div>

          <div className="border-t border-b border-dashed border-slate-300 py-2 my-2 space-y-1">
            <div className="flex justify-between"><span>Karyawan</span><span className="font-medium">{shift.employee}</span></div>
            <div className="flex justify-between"><span>Mulai</span><span>{new Date(shift.startTime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>
            <div className="flex justify-between"><span>Selesai</span><span>{new Date(shift.endTime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>
            <div className="flex justify-between"><span>Durasi</span><span>{hours}j {mins}m</span></div>
          </div>

          <div className="border-b border-dashed border-slate-300 py-2 my-2 space-y-1">
            <div className="flex justify-between"><span>Modal Awal</span><span>{fmt(shift.startCash)}</span></div>
            <div className="flex justify-between"><span>Total Penjualan</span><span className="font-medium">{fmt(shift.totalSales)}</span></div>
            <div className="flex justify-between"><span>Total Keuntungan</span><span>{fmt(shift.totalProfit)}</span></div>
            <div className="flex justify-between"><span>Jumlah Transaksi</span><span>{shift.transactionCount}</span></div>
          </div>

          <div className="py-2 space-y-1">
            <div className="flex justify-between font-bold text-sm"><span>Kas Seharusnya</span><span>{fmt(shift.expectedCash)}</span></div>
            <div className="flex justify-between"><span>Kas Aktual</span><span>{fmt(shift.actualCash)}</span></div>
            <div className="flex justify-between font-bold"><span className={shift.difference >= 0 ? 'text-emerald-600' : 'text-rose-600'}>Selisih</span><span className={shift.difference >= 0 ? 'text-emerald-600' : 'text-rose-600'}>{shift.difference >= 0 ? '+' : ''}{fmt(shift.difference)}</span></div>
          </div>

          <p className="text-center text-xs text-slate-400 mt-4">Terima Kasih!</p>
        </div>

        <div className="p-4 border-t border-slate-100 flex gap-3 no-print bg-white">
          <button onClick={() => window.print()} className="flex-1 py-3 rounded-xl bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20">🖨️ Print</button>
          <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Tutup</button>

      </div>

  );
}

// ============ KASIR ============
function Kasir({ products, cart, addToCart, updateQty, removeCart, clearCart, holdOrder, held, restoreHeld, checkout }) {
  const [search, setSearch] = useState('');
  const [cat, setCat] = useState('Semua');
  const [showCart, setShowCart] = useState(false);
  const [payment, setPayment] = useState('');
  const [showHeld, setShowHeld] = useState(false);

  const filtered = useMemo(() => {
    return products.filter(p => {
      const m = p.name.toLowerCase().includes(search.toLowerCase());
      const c = cat === 'Semua' || p.category === cat;
      return m && c;
    });
  }, [products, search, cat]);

  const total = useMemo(() => cart.reduce((s, c) => s + c.price * c.qty, 0), [cart]);
  const count = useMemo(() => cart.reduce((s, c) => s + c.qty, 0), [cart]);

  return (
    <div className="animate-fade-up">
      <div className="relative mb-3">
        <input type="text" placeholder="Cari produk..." value={search} onChange={e => setSearch(e.target.value)}
          className="w-full pl-10 pr-4 py-3 rounded-2xl bg-dark-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:border-brand-500 transition" />
        <span className="absolute left-3.5 top-3 text-slate-500 text-base">🔍</span>
      </div>

      <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4">
        {CATEGORIES.map(c => (
          <button key={c} onClick={() => setCat(c)}
            className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition ${cat===c ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/25' : 'bg-dark-800 text-slate-400 border border-slate-700'}`}>
            {c}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-2 gap-3 pb-4">
        {filtered.map(p => (
          <button key={p.id} onClick={() => addToCart(p)} className="card-hover bg-dark-800 rounded-2xl p-3.5 text-left border border-slate-700/50">
            <div className="flex items-start justify-between mb-2">
              <span className="text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-700/50 text-slate-300">{p.category}</span>
              <span className="text-[10px] text-slate-500">Stk {p.stock}</span>
            </div>
            <p className="font-semibold text-sm text-white mb-1 line-clamp-2 leading-snug">{p.name}</p>
            <p className="text-brand-400 font-bold text-base">{fmt(p.price)}</p>
          </button>
        ))}
      </div>

      {cart.length > 0 && (
        <div className="fixed bottom-20 left-0 right-0 z-30 px-4">
          <div className="max-w-lg mx-auto bg-dark-800 rounded-2xl border border-slate-700/50 p-3 flex items-center justify-between shadow-2xl">
            <div>
              <p className="text-[10px] text-slate-400">{count} item</p>
              <p className="text-brand-400 font-bold text-lg">{fmt(total)}</p>
            </div>
            <div className="flex gap-2">
              <button onClick={holdOrder} className="px-3 py-2 rounded-xl bg-amber-500/10 text-amber-400 text-xs font-semibold border border-amber-500/20">⏸️ Tahan</button>
              <button onClick={() => setShowCart(true)} className="px-4 py-2 rounded-xl bg-brand-500 text-white text-xs font-semibold shadow-lg shadow-brand-500/20">🛒 Bayar</button>
            </div>
          </div>
        </div>
      )}

      {held.length > 0 && !showCart && (
        <button onClick={() => setShowHeld(true)} className="fixed bottom-36 right-4 z-30 w-12 h-12 rounded-full bg-amber-500 text-white flex items-center justify-center shadow-lg text-lg font-bold">
          {held.length}
        </button>
      )}

      {showCart && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end" onClick={() => setShowCart(false)}>
          <div className="w-full max-w-lg mx-auto bg-dark-900 rounded-t-3xl border-t border-slate-700 animate-slide-up max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <h2 className="font-bold text-lg">🛒 Keranjang</h2>
              <button onClick={() => setShowCart(false)} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {cart.map(item => (
                <div key={item.id} className="flex items-center gap-3 bg-dark-800 rounded-xl p-3">
                  <div className="flex-1 min-w-0">
                    <p className="font-medium text-sm truncate">{item.name}</p>
                    <p className="text-xs text-slate-400">{fmt(item.price)} / pcs</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 rounded-lg bg-slate-700 text-white text-sm font-bold">−</button>
                    <span className="w-6 text-center text-sm font-semibold">{item.qty}</span>
                    <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 rounded-lg bg-brand-500 text-white text-sm font-bold">+</button>
                  </div>
                  <button onClick={() => removeCart(item.id)} className="text-rose-400 text-sm ml-1">🗑</button>
                </div>
              ))}
            </div>
            <div className="p-4 border-t border-slate-800 space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-slate-400 text-sm">Total Belanja</span>
                <span className="font-bold text-xl text-brand-400">{fmt(total)}</span>
              </div>
              <div className="flex gap-2">
                <input type="number" placeholder="Nominal bayar" value={payment} onChange={e => setPayment(e.target.value)}
                  className="flex-1 px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
                <button onClick={() => setPayment(total)} className="px-4 py-3 rounded-xl bg-slate-700 text-white text-xs font-semibold whitespace-nowrap">Uang Pas</button>
              </div>
              {parseInt(payment) >= total && (
                <div className="text-center py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                  <p className="text-emerald-400 font-semibold text-sm">Kembalian: {fmt(parseInt(payment) - total)}</p>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={clearCart} className="flex-1 py-3 rounded-xl bg-rose-500/10 text-rose-400 font-semibold text-sm border border-rose-500/20">Kosongkan</button>
                <button onClick={() => { checkout(parseInt(payment)); setShowCart(false); setPayment(''); }}
                  disabled={parseInt(payment) < total} className="flex-1 py-3 rounded-xl bg-brand-500 text-white font-semibold text-sm disabled:opacity-40 shadow-lg shadow-brand-500/20">Bayar Sekarang</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showHeld && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={() => setShowHeld(false)}>
          <div className="bg-dark-900 rounded-3xl border border-slate-700 w-full max-w-sm max-h-[70vh] flex flex-col animate-fade-up" onClick={e => e.stopPropagation()}>
            <div className="p-4 border-b border-slate-800 flex justify-between items-center">
              <h2 className="font-bold">⏸️ Pesanan Ditahan</h2>
              <button onClick={() => setShowHeld(false)} className="text-slate-400">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              {held.map(o => (
                <button key={o.id} onClick={() => { restoreHeld(o); setShowHeld(false); }} className="w-full text-left bg-dark-800 rounded-xl p-3 border border-slate-700/50">
                  <div className="flex justify-between items-center">
                    <span className="text-sm font-medium">{o.time}</span>
                    <span className="text-brand-400 font-bold">{fmt(o.total)}</span>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">{o.items.length} item</p>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ PRODUK ============
function Produk({ products, addProduct, updateProduct, deleteProduct }) {
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ name:'', price:'', cost:'', stock:'', category:'Sembako' });

  const openAdd = () => { setEditId(null); setForm({ name:'', price:'', cost:'', stock:'', category:'Sembako' }); setShowForm(true); };
  const openEdit = (p) => { setEditId(p.id); setForm({ name:p.name, price:p.price.toString(), cost:p.cost.toString(), stock:p.stock.toString(), category:p.category }); setShowForm(true); };

  const submit = () => {
    const data = { name: form.name, price: parseInt(form.price)||0, cost: parseInt(form.cost)||0, stock: parseInt(form.stock)||0, category: form.category };
    if (!data.name || !data.price) { alert('Nama dan harga wajib diisi!'); return; }
    editId ? updateProduct(editId, data) : addProduct(data);
    setShowForm(false);
  };

  return (
    <div className="animate-fade-up">
      <div className="flex justify-between items-center mb-4">
        <h2 className="font-bold text-lg">📦 Produk</h2>
        <button onClick={openAdd} className="px-4 py-2 rounded-xl bg-brand-500 text-white text-xs font-semibold shadow-lg shadow-brand-500/20">+ Tambah</button>
      </div>
      <div className="space-y-2.5">
        {products.map(p => (
          <div key={p.id} className="bg-dark-800 rounded-2xl p-4 border border-slate-700/50 flex items-center justify-between">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2 mb-1">
                <span className="text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-700/50 text-slate-300">{p.category}</span>
              </div>
              <p className="font-semibold text-sm text-white">{p.name}</p>
              <p className="text-xs text-slate-400 mt-0.5">{fmt(p.price)} · Stok {p.stock} · Modal {fmt(p.cost)}</p>
            </div>
            <div className="flex gap-1 ml-2">
              <button onClick={() => openEdit(p)} className="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-sm">✏️</button>
              <button onClick={() => deleteProduct(p.id)} className="w-9 h-9 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-sm">🗑</button>
            </div>
          </div>
        ))}
      </div>

  {showForm && (
  <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={() => setShowForm(false)}>
    <div className="bg-dark-900 rounded-3xl border border-slate-700 w-full max-w-sm p-5 animate-fade-up" onClick={e => e.stopPropagation()}>
      <h3 className="font-bold text-lg mb-4">{editId ? '✏️ Edit' : '+ Tambah'} Produk</h3>
      <div className="space-y-3">
        <input placeholder="Nama produk" value={form.name} onChange={e => setForm({...form, name:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
        <div className="flex gap-3">
          <input type="number" placeholder="Harga jual" value={form.price} onChange={e => setForm({...form, price:e.target.value})} className="flex-1 px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
          <input type="number" placeholder="Harga modal" value={form.cost} onChange={e => setForm({...form, cost:e.target.value})} className="flex-1 px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
        </div>
        <div className="flex gap-3">
          <input type="number" placeholder="Stok" value={form.stock} onChange={e => setForm({...form, stock:e.target.value})} className="flex-1 px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition" />
          <select value={form.category} onChange={e => setForm({...form, category:e.target.value})} className="flex-1 px-4 py-3 rounded-xl bg-dark-800 border border-slate-700 text-white text-sm focus:border-brand-500 transition">
            {CATEGORIES.filter(c=>c!=='Semua').map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      <div className="flex gap-3 mt-5">
        <button onClick={() => setShowForm(false)} className="flex-1 py-3 rounded-xl bg-slate-700 text-white font-semibold text-sm">Batal</button>
        <button onClick={submit} className="flex-1 py-3 rounded-xl bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20">Simpan</button>
      </div>
    </div>
  </div>
)}
</div>
  );
}

// ============ LAPORAN ============
function Laporan({ transactions }) {
  const todayTx = transactions.filter(t => t.date === todayDate());
  const todayRevenue = todayTx.reduce((s, t) => s + t.total, 0);
  const todayProfit = todayTx.reduce((s, t) => s + t.items.reduce((is, i) => is + ((i.price - (i.cost||0)) * i.qty), 0), 0);
  const totalRevenue = transactions.reduce((s, t) => s + t.total, 0);

  return (
    <div className="animate-fade-up">
      <h2 className="font-bold text-lg mb-4">📊 Laporan</h2>
      <div className="grid grid-cols-2 gap-3 mb-6">
        <div className="bg-dark-800 rounded-2xl p-4 border border-slate-700/50">
          <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Penjualan Hari Ini</p>
          <p className="text-xl font-bold text-brand-400 mt-1">{fmt(todayRevenue)}</p>
          <p className="text-[10px] text-slate-500 mt-1">{todayTx.length} transaksi</p>
        </div>
        <div className="bg-dark-800 rounded-2xl p-4 border border-slate-700/50">
          <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Keuntungan</p>
          <p className="text-xl font-bold text-emerald-400 mt-1">{fmt(todayProfit)}</p>
          <p className="text-[10px] text-slate-500 mt-1">Hari ini</p>
        </div>
        <div className="bg-dark-800 rounded-2xl p-4 border border-slate-700/50">
          <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Penjualan</p>
          <p className="text-xl font-bold text-white mt-1">{fmt(totalRevenue)}</p>
          <p className="text-[10px] text-slate-500 mt-1">Semua waktu</p>
        </div>
        <div className="bg-dark-800 rounded-2xl p-4 border border-slate-700/50">
          <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Transaksi</p>
          <p className="text-xl font-bold text-white mt-1">{transactions.length}</p>
          <p className="text-[10px] text-slate-500 mt-1">Semua waktu</p>
        </div>
      </div>
      <h3 className="font-semibold text-sm mb-3 text-slate-300">Transaksi Hari Ini</h3>
      {todayTx.length === 0 && <p className="text-slate-500 text-sm text-center py-8">Tidak ada transaksi</p>}
      <div className="space-y-2">
        {todayTx.map(tx => (
          <div key={tx.id} className="bg-dark-800 rounded-xl p-3 flex justify-between items-center border border-slate-700/50">
            <span className="text-sm text-white">{tx.time}</span>
            <span className="font-semibold text-brand-400">{fmt(tx.total)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

          <div className="border-t border-b border-dashed border-slate-300 py-2 my-2 space-y-1">
            {receipt.items.map((it, i) => (
              <div key={i} className="flex justify-between text-xs">
                <span>{it.name} x{it.qty}</span>
                <span className="font-medium">{fmt(it.price * it.qty)}</span>
              </div>
            ))}
          </div>
          <div className="space-y-1 text-sm">
            <div className="flex justify-between font-bold text-base"><span>TOTAL</span><span>{fmt(receipt.total)}</span></div>
            <div className="flex justify-between text-slate-600"><span>Bayar</span><span>{fmt(receipt.payment)}</span></div>
            <div className="flex justify-between text-slate-600"><span>Kembali</span><span>{fmt(receipt.change)}</span></div>
          </div>
          <p className="text-center text-xs text-slate-400 mt-4">Terima Kasih!</p>
        </div>
        <div className="p-4 border-t border-slate-100 flex gap-3 no-print bg-white">
          <button onClick={() => window.print()} className="flex-1 py-3 rounded-xl bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20">🖨️ Print</button>
          <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Tutup</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
