<script>
window.scanBarcode = async function() {
  try {
    const { BarcodeScanner } = await import('@capacitor-community/barcode-scanner');
    const status = await BarcodeScanner.checkPermission({ force: true });
    if (!status.granted) {
      alert('Izin kamera diperlukan untuk scan barcode!');
      return;
    }
    await BarcodeScanner.hideBackground();
    const result = await BarcodeScanner.startScan();
    if (result.hasContent) {
      alert('Barcode: ' + result.content);
    }
    await BarcodeScanner.showBackground();
  } catch (e) {
    alert('Error: ' + e.message);
  }
};
</script>

const LogoSVG = ({ size = 40, className = '', showText = true, showTagline = false, dark = false }) => {
  const hexSize = size * 0.45;
  const hexPoints = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 2;
    hexPoints.push(`${hexSize * Math.cos(angle) + size/2},${hexSize * Math.sin(angle) + size/2}`);
  }

  return (
    <div className={`flex items-center gap-2 ${className}`}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
        <circle cx={size/2} cy={size/2} r={size/2 - 1} fill={dark ? '#0f172a' : '#1e3a5f'} opacity="0.15"/>
        <polygon points={hexPoints.join(' ')} fill="#14b8a6" stroke="#0d9488" strokeWidth="1"/>
        <polyline 
          points={`${size*0.32},${size*0.48} ${size*0.44},${size*0.62} ${size*0.68},${size*0.36}`}

// ==================== BASE COMPONENTS ====================
const Button = ({ children, onClick, variant = 'primary', size = 'md', className = '', disabled = false, icon = null }) => {
  const variants = {
    primary: 'bg-primary-600 hover:bg-primary-700 text-white shadow-sm',
    secondary: 'bg-slate-200 hover:bg-slate-300 text-slate-800 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100',
    outline: 'border-2 border-slate-300 hover:border-primary-500 text-slate-700 dark:border-slate-600 dark:text-slate-300 dark:hover:border-primary-400',
    ghost: 'hover:bg-slate-100 text-slate-600 dark:hover:bg-slate-800 dark:text-slate-400',
    danger: 'bg-rose-500 hover:bg-rose-600 text-white',
    success: 'bg-emerald-500 hover:bg-emerald-600 text-white',
    warning: 'bg-amber-500 hover:bg-amber-600 text-white',
    brand: 'bg-brand-900 hover:bg-brand-800 text-white shadow-sm',
  };
  const sizes = { sm: 'px-2 py-1 text-xs', md: 'px-3 py-2 text-sm', lg: 'px-4 py-3 text-base' };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}>
      {icon && <span className="opacity-80">{icon}</span>}
      {children}
    </button>
  );
};

const Input = ({ label, type = 'text', value, onChange, placeholder = '', className = '', suffix = null, rows = null }) => (
  <div className={className}>
    {label && <label className="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{label}</label>}
    <div className="relative">
      {rows ? (
        <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows}
          className="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all dark:text-white resize-none" />
      ) : (
        <input type={type} value={value} onChange={onChange} placeholder={placeholder}
          className="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all dark:text-white" />
      )}
      {suffix && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs">{suffix}</span>}
    </div>
  </div>
);

const Toggle = ({ label, checked, onChange }) => (
  <label className="flex items-center justify-between cursor-pointer py-1">
    <span className="text-sm text-slate-700 dark:text-slate-300">{label}</span>
    <div onClick={() => onChange(!checked)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${checked ? 'bg-primary-500' : 'bg-slate-300 dark:bg-slate-600'}`}>
      <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${checked ? 'translate-x-6' : 'translate-x-1'}`} />
    </div>
  </label>
);

const Card = ({ children, className = '', onClick }) => (
  <div onClick={onClick} className={`bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 ${onClick ? 'cursor-pointer active:scale-[0.98] transition-transform' : ''} ${className}`}>
    {children}
  </div>
);

const Badge = ({ children, color = 'blue', className = '' }) => {
  const colors = {
    blue: 'bg-primary-100 text-primary-700 dark:bg-primary-900/30 dark:text-primary-300',
    green: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
    red: 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-300',
    amber: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
    slate: 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300',
    brand: 'bg-brand-100 text-brand-700 dark:bg-brand-900/30 dark:text-brand-300',
  };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium ${colors[color]} ${className}`}>{children}</span>;
};

const Modal = ({ isOpen, onClose, title, children, size = 'md' }) => {
  if (!isOpen) return null;
  const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg', xl: 'max-w-xl', '2xl': 'max-w-2xl', full: 'max-w-full mx-4' };
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" />
      <div className={`relative bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] overflow-hidden slide-up`} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700">
          <h3 className="font-semibold text-slate-800 dark:text-white">{title}</h3>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
            <Icon name="close" size={18} />
          </button>
        </div>
        <div className="overflow-y-auto max-h-[70vh] p-4">{children}</div>
      </div>
    </div>
  );
};

const Toast = ({ message, type = 'success', onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 2500); return () => clearTimeout(t); }, [onClose]);
  const colors = { success: 'bg-emerald-500', error: 'bg-rose-500', info: 'bg-primary-500', warning: 'bg-amber-500' };
  return (
    <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[60] ${colors[type]} text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium fade-in flex items-center gap-2`}>
      <Icon name={type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info'} size={16} />
      {message}
    </div>
  );
};

// ==================== RECEIPT RENDERER ====================
const ReceiptPreview = ({ receipt, transaction, settings, isPrint = false }) => {
  const r = receipt;
  const t = transaction;
  const s = settings;

  const widthClass = r.paperWidth === '80mm' ? 'w-[320px]' : 'w-[240px]';
  const fontClass = r.fontFamily === 'mono' ? 'thermal-font' : 'font-sans';
  const sizeClass = r.fontSize === 'small' ? 'text-[10px]' : r.fontSize === 'large' ? 'text-sm' : 'text-xs';
  const alignClass = r.headerStyle === 'center' ? 'text-center' : 'text-left';

  const sep = r.separatorStyle === 'dash' ? '─'.repeat(r.paperWidth === '80mm' ? 40 : 28) 
    : r.separatorStyle === 'dot' ? '·'.repeat(r.paperWidth === '80mm' ? 60 : 40)
    : r.separatorStyle === 'line' ? '━'.repeat(r.paperWidth === '80mm' ? 30 : 20)
    : '';

  const logoDisplay = () => {
    if (!r.showLogo) return null;
    if (r.logoStyle === 'none') return null;
    if (r.logoStyle === 'hexagon') {
      const hs = r.fontSize === 'small' ? 14 : r.fontSize === 'large' ? 22 : 18;
      const hexPoints = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 2;
        hexPoints.push(`${hs * Math.cos(angle) + hs/2 + 2},${hs * Math.sin(angle) + hs/2 + 2}`);
      }
      return (
        <div className="flex flex-col items-center gap-1">
          <svg width={hs+4} height={hs+4} viewBox={`0 0 ${hs+4} ${hs+4}`}>
            <polygon points={hexPoints.join(' ')} fill="#14b8a6" stroke="#0d9488" strokeWidth="0.5"/>
            <polyline points={`${hs*0.32+2},${hs*0.48+2} ${hs*0.44+2},${hs*0.62+2} ${hs*0.68+2},${hs*0.36+2}`}
              fill="none" stroke="white" strokeWidth={hs*0.08} strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div className="font-extrabold tracking-wider" style={{fontSize: r.fontSize==='small'?10:r.fontSize==='large'?16:12}}>AKURATAMA</div>
        </div>
      );
    }
    if (r.logoStyle === 'star') return <div className="text-lg leading-tight">{r.logoText}</div>;
    if (r.logoStyle === 'box') return <div className="border-2 border-current inline-block px-2 py-0.5 text-sm font-bold tracking-wider">{r.storeName}</div>;
    return <div className="text-base font-bold tracking-wide">{r.logoText}</div>;
  };

  const txId = t?.id ? t.id.slice(-8).toUpperCase() : 'DEMO1234';
  const txDate = t?.date ? new Date(t.date).toLocaleDateString('id-ID') : new Date().toLocaleDateString('id-ID');
  const txTime = t?.date ? new Date(t.date).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : timeStr();

  return (
    <div id={isPrint ? "print-receipt" : ""} 
      className={`receipt-paper ${widthClass} ${fontClass} ${sizeClass} ${alignClass} mx-auto p-4 text-slate-900 bg-white`}
      style={{ color: '#000', background: '#fff' }}>

      {/* Logo */}
      <div className="mb-2">{logoDisplay()}</div>

      {/* Store Info */}
      {r.showAddress && r.storeAddress && <div className="mb-0.5">{r.storeAddress}</div>}
      {r.showPhone && r.storePhone && <div className="mb-0.5">Telp: {r.storePhone}</div>}
      {r.showEmail && r.storeEmail && <div className="mb-0.5">{r.storeEmail}</div>}
      {r.showWebsite && r.storeWebsite && <div className="mb-0.5">{r.storeWebsite}</div>}
      {r.showTaxId && r.taxId && <div className="mb-0.5">{r.taxId}</div>}

      {sep && <div className="my-1.5 opacity-60">{sep}</div>}

      {/* Transaction Info */}
      {r.showTransactionId && <div className="text-left flex justify-between"><span>No:</span><span>{txId}</span></div>}
      {r.showTimestamp && (
        <>
          <div className="text-left flex justify-between"><span>Tgl:</span><span>{txDate}</span></div>
          <div className="text-left flex justify-between"><span>Jam:</span><span>{txTime}</span></div>
        </>
      )}
      {r.showCashier && <div className="text-left flex justify-between"><span>Kasir:</span><span>{t?.cashier || s.cashierName}</span></div>}

      {sep && <div className="my-1.5 opacity-60">{sep}</div>}

      {/* Items */}
      {t?.items ? (
        t.items.map((item, i) => (
          <div key={i} className="text-left mb-1">
            <div className="flex justify-between">
              <span className="truncate pr-1" style={{maxWidth: r.paperWidth==='80mm'?'200px':'140px'}}>{item.name}</span>
              <span>{fmt(item.price * item.qty)}</span>
            </div>
            {r.itemLayout === 'detailed' && (
              <div className="flex justify-between text-[10px] opacity-70">
                <span>{item.qty} x {fmt(item.price)}</span>
                {r.showCostPrice && item.cost && <span>Modal: {fmt(item.cost)}</span>}
              </div>
            )}
            {r.itemLayout === 'detailed' && item.discount > 0 && (

const CashierScreen = ({ products, cart, setCart, heldOrders, setHeldOrders, receipt, settings, onCheckout, onOpenReceiptEditor }) => {
  const [search, setSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState('Semua');
  const [showPayment, setShowPayment] = useState(false);
  const [paymentMethod, setPaymentMethod] = useState('Tunai');
  const [paidAmount, setPaidAmount] = useState('');
  const [discount, setDiscount] = useState(0);
  const [discountType, setDiscountType] = useState('nominal');
  const [toast, setToast] = useState(null);
  const [showHeld, setShowHeld] = useState(false);

  const categories = ['Semua', ...new Set(products.map(p => p.category))];
  const filtered = products.filter(p => {
    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
    const matchCat = activeCategory === 'Semua' || p.category === activeCategory;
    return matchSearch && matchCat;
  });

  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if (existing) {
        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...prev, { ...product, qty: 1, itemDiscount: 0 }];
    });
  };

  const updateQty = (id, delta) => {
    setCart(prev => prev.map(i => {
      if (i.id !== id) return i;
      const newQty = Math.max(1, i.qty + delta);
      return { ...i, qty: newQty };
    }).filter(i => i.qty > 0));
  };

  const removeFromCart = (id) => {
    setCart(prev => prev.filter(i => i.id !== id));
  };

  const clearCart = () => setCart([]);

  const holdOrder = () => {
    if (cart.length === 0) return;
    const held = { id: uid(), items: [...cart], date: now(), note: '' };
    setHeldOrders(prev => [...prev, held]);
    setCart([]);
    setToast({ message: 'Pesanan ditahan', type: 'info' });
  };

  const resumeOrder = (held) => {
    setCart(held.items);
    setHeldOrders(prev => prev.filter(h => h.id !== held.id));
    setShowHeld(false);
    setToast({ message: 'Pesanan dilanjutkan', type: 'info' });
  };

  const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
  const discAmount = discountType === 'percent' ? Math.round(subtotal * discount / 100) : discount;
  const taxAmount = Math.round((subtotal - discAmount) * settings.taxRate / 100);
  const total = subtotal - discAmount + taxAmount;
  const change = Math.max(0, (parseInt(paidAmount) || 0) - total);

  const handleCheckout = () => {
    if (cart.length === 0) return;
    const paid = parseInt(paidAmount) || total;
    const tx = {
      id: uid(),
      date: now(),
      items: cart.map(i => ({ ...i })),
      subtotal,
      discount: discAmount,
      tax: taxAmount,
      total,
      paid,
      change: paid - total,
      paymentMethod,
      cashier: settings.cashierName,
    };
    onCheckout(tx);
    setCart([]);
    setShowPayment(false);
    setPaidAmount('');
    setDiscount(0);
    setToast({ message: 'Transaksi berhasil!', type: 'success' });
  };

  return (
    <div className="h-full flex flex-col">
      {toast && <Toast {...toast} onClose={() => setToast(null)} />}

      {/* Search & Categories */}
      <div className="px-4 pt-4 pb-2 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
        <div className="relative mb-3">
          <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input type="text" placeholder="Cari produk..." value={search} onChange={e => setSearch(e.target.value)}

// ==================== PRODUCT MANAGER ====================
const ProductManager = ({ products, setProducts }) => {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState('');
  const [form, setForm] = useState({ name: '', price: '', cost: '', stock: '', category: 'Sembako', expiry: '' });
  const [toast, setToast] = useState(null);

  const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

  const handleSubmit = () => {
    if (!form.name || !form.price) return;
    const data = {
      id: editing ? editing.id : uid(),
      name: form.name,
      price: parseInt(form.price) || 0,
      cost: parseInt(form.cost) || 0,
      stock: parseInt(form.stock) || 0,
      category: form.category,
      expiry: form.expiry,
    };
    if (editing) {
      setProducts(prev => prev.map(p => p.id === editing.id ? data : p));
      setToast({ message: 'Produk diperbarui', type: 'success' });
    } else {
      setProducts(prev => [...prev, data]);
      setToast({ message: 'Produk ditambahkan', type: 'success' });
    }
    setShowForm(false);
    setEditing(null);
    setForm({ name: '', price: '', cost: '', stock: '', category: 'Sembako', expiry: '' });
  };

  const handleEdit = (p) => {
    setEditing(p);
    setForm({ name: p.name, price: p.price, cost: p.cost, stock: p.stock, category: p.category, expiry: p.expiry });
    setShowForm(true);
  };

  const handleDelete = (id) => {
    if (confirm('Hapus produk ini?')) {
      setProducts(prev => prev.filter(p => p.id !== id));
      setToast({ message: 'Produk dihapus', type: 'info' });
    }
  };

  const exportCSV = () => {
    const headers = ['Nama,Harga Jual,Harga Modal,Stok,Kategori,Kadaluarsa'];
    const rows = products.map(p => `"${p.name}",${p.price},${p.cost},${p.stock},"${p.category}","${p.expiry}"`);
    const csv = [headers, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `produk_${today()}.csv`; a.click();
    setToast({ message: 'CSV berhasil diexport', type: 'success' });
  };

  const lowStock = products.filter(p => p.stock <= 5);
  const expiringSoon = products.filter(p => {
    if (!p.expiry) return false;
    const days = Math.ceil((new Date(p.expiry) - new Date()) / (1000 * 60 * 60 * 24));
    return days <= 30 && days >= 0;
  });

  return (
    <div className="h-full flex flex-col">
      {toast && <Toast {...toast} onClose={() => setToast(null)} />}

      <div className="px-4 pt-4 pb-2">
        <div className="flex gap-2 mb-3">
          <div className="relative flex-1">
            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input type="text" placeholder="Cari produk..." value={search} onChange={e => setSearch(e.target.value)}
              className="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-slate-800 rounded-xl text-sm border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary-500 outline-none dark:text-white" />
          </div>
          <Button onClick={() => { setEditing(null); setForm({ name: '', price: '', cost: '', stock: '', category: 'Sembako', expiry: '' }); setShowForm(true); }}
            icon={<Icon name="plus" size={16} />}>Tambah</Button>
          <Button variant="outline" onClick={exportCSV} icon={<Icon name="download" size={16} />}>CSV</Button>
        </div>

        {(lowStock.length > 0 || expiringSoon.length > 0) && (
          <div className="flex gap-2 mb-3 overflow-x-auto no-scrollbar">
            {lowStock.length > 0 && (
              <div className="flex items-center gap-1.5 bg-rose-50 dark:bg-rose-900/20 text-rose-700 dark:text-rose-300 px-3 py-1.5 rounded-full text-xs whitespace-nowrap">
                <Icon name="alert" size={12} /> {lowStock.length} stok menipis
              </div>
            )}
            {expiringSoon.length > 0 && (
              <div className="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-900/20 text-amber-700 dark:text-amber-300 px-3 py-1.5 rounded-full text-xs whitespace-nowrap">
                <Icon name="alert" size={12} /> {expiringSoon.length} akan kadaluarsa
              </div>
            )}
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto px-4 pb-4">
        <div className="space-y-2">
          {filtered.map(p => (
            <Card key={p.id} className="p-3">
              <div className="flex items-center justify-between">
                <div className="flex-1 min-w-0">
                  <div className="font-medium text-sm text-slate-800 dark:text-white">{p.name}</div>
                  <div className="flex items-center gap-2 mt-1">
                    <Badge color="blue">{p.category}</Badge>
                    <span className="text-xs text-slate-500">Stok: <span className={p.stock <= 5 ? 'text-rose-500 font-bold' : ''}>{p.stock}</span></span>
                    {p.expiry && (
                      <span className="text-[10px] text-slate-400">Exp: {p.expiry}</span>
                    )}
                  </div>
                </div>
                <div className="text-right mr-3">
                  <div className="font-bold text-sm text-slate-800 dark:text-white">{fmt(p.price)}</div>
                  <div className="text-[10px] text-slate-400">Modal: {fmt(p.cost)}</div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => handleEdit(p)} className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500">
                    <Icon name="edit" size={14} />
                  </button>
                  <button onClick={() => handleDelete(p.id)} className="p-2 rounded-lg hover:bg-rose-100 text-rose-500">
                    <Icon name="trash" size={14} />
                  </button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      </div>

      <Modal isOpen={showForm} onClose={() => setShowForm(false)} title={editing ? 'Edit Produk' : 'Tambah Produk'}>
        <div className="space-y-3">
          <Input label="Nama Produk" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
          <div className="grid grid-cols-2 gap-3">
            <Input label="Harga Jual" type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
            <Input label="Harga Modal" type="number" value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Input label="Stok" type="number" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} />
            <div>
              <label className="block text-xs font-medium text-slate-500 mb-1">Kategori</label>
              <select value={form.category} onChange={e => setForm({...form, category: e.target.value})}
                className="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm dark:text-white outline-none">
                {['Sembako', 'Makanan', 'Minuman', 'Kebutuhan', 'Lainnya'].map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <Input label="Tanggal Kadaluarsa (opsional)" type="date" value={form.expiry} onChange={e => setForm({...form, expiry: e.target.value})} />
          <div className="flex gap-2 pt-2">
            <Button variant="secondary" className="flex-1" onClick={() => setShowForm(false)}>Batal</Button>
            <Button variant="primary" className="flex-1" onClick={handleSubmit}>{editing ? 'Simpan' : 'Tambah'}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ==================== HISTORY SCREEN ====================
const HistoryScreen = ({ transactions, receipt, settings }) => {
  const [search, setSearch] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [selectedTx, setSelectedTx] = useState(null);
  const [showReceipt, setShowReceipt] = useState(false);

  const filtered = transactions.filter(tx => {
    const matchSearch = tx.items.some(i => i.name.toLowerCase().includes(search.toLowerCase()));
    const d = new Date(tx.date);
    const matchFrom = !dateFrom || d >= new Date(dateFrom);
    const matchTo = !dateTo || d <= new Date(dateTo + 'T23:59:59');
    return matchSearch && matchFrom && matchTo;
  }).sort((a, b) => new Date(b.date) - new Date(a.date));

  const exportCSV = () => {
    const headers = ['Tanggal,No Transaksi,Kasir,Item,Subtotal,Diskon,PPN,Total,Metode Bayar'];
    const rows = filtered.map(tx => {
      const items = tx.items.map(i => `${i.name}(${i.qty})`).join('; ');
      return `"${new Date(tx.date).toLocaleString('id-ID')}","${tx.id.slice(-8)}","${tx.cashier}","${items}",${tx.subtotal},${tx.discount},${tx.tax},${tx.total},"${tx.paymentMethod}"`;
    });
    const csv = [headers, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `transaksi_${today()}.csv`; a.click();
  };

  return (
    <div className="h-full flex flex-col">
      <div className="px-4 pt-4 pb-2">
        <div className="flex gap-2 mb-3">
          <div className="relative flex-1">
            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input type="text" placeholder="Cari item..." value={search} onChange={e => setSearch(e.target.value)}
              className="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-slate-800 rounded-xl text-sm border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-primary-500 outline-none dark:text-white" />
          </div>
          <Button variant="outline" onClick={exportCSV} icon={<Icon name="download" size={16} />}>CSV</Button>
        </div>
        <div className="flex gap-2">
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
            className="flex-1 px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" />
          <span className="self-center text-slate-400">-</span>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)}
            className="flex-1 px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" />
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-4 pb-4">
        <div className="space-y-2">
          {filtered.map(tx => (
            <Card key={tx.id} className="p-3" onClick={() => { setSelectedTx(tx); setShowReceipt(true); }}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="font-medium text-sm text-slate-800 dark:text-white">#{tx.id.slice(-8).toUpperCase()}</div>
                  <div className="text-xs text-slate-500">{new Date(tx.date).toLocaleString('id-ID')} · {tx.cashier}</div>
                  <div className="text-xs text-slate-400 mt-0.5">{tx.items.length} item · {tx.paymentMethod}</div>
                </div>
                <div className="text-right">
                  <div className="font-bold text-sm text-slate-800 dark:text-white">{fmt(tx.total)}</div>
                  <div className="text-[10px] text-emerald-600">Lihat Struk →</div>
                </div>
              </div>
            </Card>
          ))}
          {filtered.length === 0 && (
            <div className="text-center py-12 text-slate-400">
              <Icon name="receipt" size={40} className="mx-auto mb-2 opacity-30" />

            </div>
          )}

      </div>

      <Modal isOpen={showReceipt} onClose={() => setShowReceipt(false)} title="Detail Struk" size="md">
        {selectedTx && (
          <div className="space-y-4">
            <ReceiptPreview receipt={receipt} transaction={selectedTx} settings={settings} />

              <Button variant="outline" className="flex-1" onClick={() => window.print()} icon={<Icon name="print" size={14} />}>Print</Button>
              <Button variant="secondary" className="flex-1" onClick={() => setShowReceipt(false)}>Tutup</Button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
};

// ==================== REPORTS SCREEN ====================
const ReportsScreen = ({ transactions, products }) => {
  const [period, setPeriod] = useState('today');

  const now = new Date();
  const periods = {
    today: { label: 'Hari Ini', from: new Date(now.getFullYear(), now.getMonth(), now.getDate()) },
    week: { label: '7 Hari', from: new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000) },
    month: { label: '30 Hari', from: new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000) },
    all: { label: 'Semua', from: new Date(0) },
  };

  const filtered = transactions.filter(tx => new Date(tx.date) >= periods[period].from);

  const totalRevenue = filtered.reduce((s, t) => s + t.total, 0);
  const totalProfit = filtered.reduce((s, t) => s + t.items.reduce((is, i) => is + (i.price - (i.cost || 0)) * i.qty, 0), 0);
  const totalTransactions = filtered.length;
  const avgOrder = totalTransactions > 0 ? Math.round(totalRevenue / totalTransactions) : 0;

  const productSales = {};
  filtered.forEach(tx => {
    tx.items.forEach(i => {
      productSales[i.name] = (productSales[i.name] || 0) + i.qty;
    });
  });
  const topProducts = Object.entries(productSales).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const dailyData = {};
  filtered.forEach(tx => {
    const d = new Date(tx.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    dailyData[d] = (dailyData[d] || 0) + tx.total;
  });
  const dailyLabels = Object.keys(dailyData).slice(-7);
  const dailyValues = dailyLabels.map(d => dailyData[d]);
  const maxVal = Math.max(...dailyValues, 1);

  return (
    <div className="h-full overflow-y-auto">
      <div className="px-4 pt-4 pb-2">
        <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4">
          {Object.entries(periods).map(([key, p]) => (
            <button key={key} onClick={() => setPeriod(key)}
              className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${
                period === key ? 'bg-primary-500 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
              }`}>
              {p.label}
            </button>
          ))}
        </div>

        <div className="grid grid-cols-2 gap-3 mb-4">
          <Card className="p-4">
            <div className="text-xs text-slate-500 mb-1">Total Penjualan</div>
            <div className="text-xl font-bold text-slate-800 dark:text-white">{fmt(totalRevenue)}</div>
          </Card>
          <Card className="p-4">
            <div className="text-xs text-slate-500 mb-1">Estimasi Profit</div>
            <div className="text-xl font-bold text-emerald-600 dark:text-emerald-400">{fmt(totalProfit)}</div>
          </Card>
          <Card className="p-4">
            <div className="text-xs text-slate-500 mb-1">Jumlah Transaksi</div>
            <div className="text-xl font-bold text-slate-800 dark:text-white">{totalTransactions}</div>
          </Card>
          <Card className="p-4">
            <div className="text-xs text-slate-500 mb-1">Rata-rata Order</div>
            <div className="text-xl font-bold text-slate-800 dark:text-white">{fmt(avgOrder)}</div>
          </Card>
        </div>

        {dailyLabels.length > 0 && (
          <Card className="p-4 mb-4">
            <h3 className="font-semibold text-sm text-slate-800 dark:text-white mb-3">Grafik Penjualan</h3>
            <div className="flex items-end gap-2 h-32">
              {dailyLabels.map((label, i) => (
                <div key={label} className="flex-1 flex flex-col items-center gap-1">
                  <div className="w-full bg-primary-200 dark:bg-primary-900/30 rounded-t-lg relative" style={{ height: `${(dailyValues[i] / maxVal) * 100}%`, minHeight: '4px' }}>
                    <div className="absolute bottom-0 left-0 right-0 bg-primary-500 rounded-t-lg" style={{ height: '100%' }}></div>
                  </div>
                  <span className="text-[9px] text-slate-500 rotate-0">{label}</span>
                </div>
              ))}
            </div>
          </Card>
        )}

        <Card className="p-4 mb-4">
          <h3 className="font-semibold text-sm text-slate-800 dark:text-white mb-3">Produk Terlaris</h3>
          <div className="space-y-2">
            {topProducts.map(([name, qty], i) => (
              <div key={name} className="flex items-center gap-3">
                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                  i === 0 ? 'bg-amber-100 text-amber-700' : i === 1 ? 'bg-slate-200 text-slate-600' : i === 2 ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500'
                }`}>{i + 1}</div>
                <div className="flex-1 text-sm text-slate-700 dark:text-slate-300">{name}</div>
                <div className="text-sm font-bold text-slate-800 dark:text-white">{qty}x</div>
              </div>
            ))}
            {topProducts.length === 0 && <div className="text-sm text-slate-400 text-center py-4">Belum ada data</div>}
          </div>
        </Card>
      </div>
    </div>
  );
};

// ==================== SETTINGS SCREEN ====================
const SettingsScreen = ({ settings, setSettings, receipt, setReceipt, products, setProducts, transactions, setTransactions, onOpenReceiptEditor }) => {
  const [toast, setToast] = useState(null);
  const [showResetConfirm, setShowResetConfirm] = useState(false);

  const backupData = () => {
    const data = { products, transactions, receipt, settings, exportDate: now() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `akuratama_backup_${today()}.json`; a.click();
    setToast({ message: 'Backup berhasil diunduh', type: 'success' });
  };

  const restoreData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.products) setProducts(data.products);
        if (data.transactions) setTransactions(data.transactions);
        if (data.receipt) { setReceipt(data.receipt); LS.set(STORAGE_KEYS.receipt, data.receipt); }
        if (data.settings) { setSettings(data.settings); LS.set(STORAGE_KEYS.settings, data.settings); }
        setToast({ message: 'Data berhasil dipulihkan', type: 'success' });
      } catch {
        setToast({ message: 'File backup tidak valid', type: 'error' });
      }
    };
    reader.readAsText(file);
  };

  const resetAll = () => {
    Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
    setProducts([...SAMPLE_PRODUCTS]);
    setTransactions([]);
    setReceipt({ ...DEFAULT_RECEIPT });
    setSettings({ ...DEFAULT_SETTINGS });
    setShowResetConfirm(false);
    setToast({ message: 'Semua data direset', type: 'info' });
  };

  return (
    <div className="h-full overflow-y-auto">
      {toast && <Toast {...toast} onClose={() => setToast(null)} />}

      <div className="px-4 pt-4 pb-8 space-y-4">
        {/* Logo Banner */}
        <div className="bg-brand-900 rounded-2xl p-6 text-center">
          <div className="flex justify-center mb-3">
            <LogoSVG size={56} showText={false} />
          </div>
          <h2 className="text-white font-extrabold text-xl tracking-wider">AKURATAMA</h2>
          <p className="text-brand-300 text-xs mt-1">Solusi Stok Opname & POS Terpercaya</p>
        </div>

        <Card className="p-4">
          <h3 className="font-semibold text-slate-800 dark:text-white mb-3 flex items-center gap-2">
            <Icon name="settings" size={16} className="text-primary-500" /> Pengaturan Umum
          </h3>
          <div className="space-y-3">
            <Input label="Nama Kasir Default" value={settings.cashierName} 
              onChange={e => { const s = {...settings, cashierName: e.target.value}; setSettings(s); LS.set(STORAGE_KEYS.settings, s); }} />
            <div>
              <label className="block text-xs font-medium text-slate-500 mb-1">PPN (%)</label>
              <div className="flex items-center gap-2">
                <input type="range" min="0" max="20" value={settings.taxRate} 
                  onChange={e => { const s = {...settings, taxRate: parseInt(e.target.value)}; setSettings(s); LS.set(STORAGE_KEYS.settings, s); }}
                  className="flex-1" />
                <span className="text-sm font-bold w-10 text-right">{settings.taxRate}%</span>
              </div>
            </div>
          </div>
        </Card>

        <Card className="p-4">
          <h3 className="font-semibold text-slate-800 dark:text-white mb-3 flex items-center gap-2">
            <Icon name="receipt" size={16} className="text-primary-500" /> Tampilan Struk
          </h3>
          <p className="text-xs text-slate-500 mb-3">Kustomisasi logo, footer, font, dan elemen struk</p>
          <Button variant="brand" onClick={onOpenReceiptEditor} icon={<Icon name="edit" size={16} />} className="w-full">
            Buka Editor Struk
          </Button>
        </Card>

        <Card className="p-4">
          <h3 className="font-semibold text-slate-800 dark:text-white mb-3 flex items-center gap-2">
            <Icon name="save" size={16} className="text-emerald-500" /> Backup & Restore
          </h3>
          <div className="space-y-2">
            <Button variant="secondary" onClick={backupData} icon={<Icon name="download" size={16} />} className="w-full">
              Download Backup (JSON)
            </Button>
            <label className="block">
              <input type="file" accept=".json" onChange={restoreData} className="hidden" />
              <div className="w-full px-3 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm font-medium text-center cursor-pointer transition-colors flex items-center justify-center gap-1.5">
                <Icon name="upload" size={16} /> Restore dari File
              </div>
            </label>
          </div>
        </Card>

        <Card className="p-4 border-rose-200 dark:border-rose-800">
          <h3 className="font-semibold text-rose-700 dark:text-rose-400 mb-3 flex items-center gap-2">
            <Icon name="alert" size={16} /> Zona Berbahaya
          </h3>
          <Button variant="danger" onClick={() => setShowResetConfirm(true)} icon={<Icon name="trash" size={16} />} className="w-full">
            Reset Semua Data
          </Button>
        </Card>
      </div>

      <Modal isOpen={showResetConfirm} onClose={() => setShowResetConfirm(false)} title="Konfirmasi Reset" size="sm">
        <div className="text-center space-y-4">
          <div className="w-12 h-12 bg-rose-100 dark:bg-rose-900/30 rounded-full flex items-center justify-center mx-auto">
            <Icon name="alert" size={24} className="text-rose-500" />
          </div>
          <div>
            <p className="text-sm text-slate-600 dark:text-slate-300">Semua data produk, transaksi, dan pengaturan akan dihapus permanen.</p>
            <p className="text-xs text-slate-400 mt-1">Tindakan ini tidak dapat dibatalkan.</p>
          </div>
          <div className="flex gap-2">
            <Button variant="secondary" className="flex-1" onClick={() => setShowResetConfirm(false)}>Batal</Button>
            <Button variant="danger" className="flex-1" onClick={resetAll}>Ya, Reset</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

// ==================== MAIN APP ====================
const App = () => {
  const [darkMode, setDarkMode] = useState(() => LS.get(STORAGE_KEYS.darkMode, false));
  const [activeTab, setActiveTab] = useState('kasir');
  const [showReceiptEditor, setShowReceiptEditor] = useState(false);
  const [lastTransaction, setLastTransaction] = useState(null);
  const [showLastReceipt, setShowLastReceipt] = useState(false);

  const [products, setProducts] = useState(() => LS.get(STORAGE_KEYS.products, [...SAMPLE_PRODUCTS]));
  const [transactions, setTransactions] = useState(() => LS.get(STORAGE_KEYS.transactions, []));
  const [receipt, setReceipt] = useState(() => LS.get(STORAGE_KEYS.receipt, { ...DEFAULT_RECEIPT }));
  const [settings, setSettings] = useState(() => LS.get(STORAGE_KEYS.settings, { ...DEFAULT_SETTINGS }));
  const [cart, setCart] = useState(() => LS.get(STORAGE_KEYS.cart, []));
  const [heldOrders, setHeldOrders] = useState(() => LS.get(STORAGE_KEYS.heldOrders, []));

  useEffect(() => { LS.set(STORAGE_KEYS.products, products); }, [products]);
  useEffect(() => { LS.set(STORAGE_KEYS.transactions, transactions); }, [transactions]);
  useEffect(() => { LS.set(STORAGE_KEYS.receipt, receipt); }, [receipt]);
  useEffect(() => { LS.set(STORAGE_KEYS.settings, settings); }, [settings]);
  useEffect(() => { LS.set(STORAGE_KEYS.cart, cart); }, [cart]);
  useEffect(() => { LS.set(STORAGE_KEYS.heldOrders, heldOrders); }, [heldOrders]);
  useEffect(() => { 
    LS.set(STORAGE_KEYS.darkMode, darkMode);
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [darkMode]);

  const handleCheckout = (tx) => {
    setTransactions(prev => [tx, ...prev]);
    setLastTransaction(tx);
    setShowLastReceipt(true);
    setProducts(prev => prev.map(p => {
      const item = tx.items.find(i => i.id === p.id);
      if (item) return { ...p, stock: Math.max(0, p.stock - item.qty) };
      return p;
    }));
  };

  const tabs = [
    { id: 'kasir', label: 'Kasir', icon: 'cart' },
    { id: 'produk', label: 'Produk', icon: 'box' },
    { id: 'riwayat', label: 'Riwayat', icon: 'receipt' },
    { id: 'laporan', label: 'Laporan', icon: 'chart' },
    { id: 'pengaturan', label: 'Pengaturan', icon: 'settings' },
  ];

  if (showReceiptEditor) {
    return (
      <ReceiptEditor 
        receipt={receipt} 
        setReceipt={setReceipt} 
        onClose={() => setShowReceiptEditor(false)}
        onSave={() => {}}
        settings={settings}
      />
    );
  }

  return (
    <div className="h-screen flex flex-col bg-slate-100 dark:bg-slate-900">
      {/* Header with New Logo */}
      <header className="bg-brand-900 border-b border-brand-800 px-4 py-3 flex items-center justify-between shrink-0">
        <LogoSVG size={36} showText={true} showTagline={false} dark={true} />
        <div className="flex items-center gap-1">
          {heldOrders.length > 0 && (
            <button className="p-2 rounded-lg hover:bg-brand-800 text-amber-400 relative">
              <Icon name="pause" size={18} />
              <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-amber-500 text-white text-[9px] rounded-full flex items-center justify-center font-bold">{heldOrders.length}</span>
            </button>
          )}
          <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg hover:bg-brand-800 text-brand-300 transition-colors">
            <Icon name={darkMode ? 'sun' : 'moon'} size={18} />
          </button>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 overflow-hidden">
        {activeTab === 'kasir' && (
          <CashierScreen 
            products={products} cart={cart} setCart={setCart}
            heldOrders={heldOrders} setHeldOrders={setHeldOrders}
            receipt={receipt} settings={settings}
            onCheckout={handleCheckout} onOpenReceiptEditor={() => setShowReceiptEditor(true)}
          />
        )}
        {activeTab === 'produk' && <ProductManager products={products} setProducts={setProducts} />}
        {activeTab === 'riwayat' && <HistoryScreen transactions={transactions} receipt={receipt} settings={settings} />}
        {activeTab === 'laporan' && <ReportsScreen transactions={transactions} products={products} />}
        {activeTab === 'pengaturan' && (
          <SettingsScreen 
            settings={settings} setSettings={setSettings}
            receipt={receipt} setReceipt={setReceipt}
            products={products} setProducts={setProducts}
            transactions={transactions} setTransactions={setTransactions}
            onOpenReceiptEditor={() => setShowReceiptEditor(true)}
          />
        )}
      </main>

      {/* Last Receipt Modal */}
      <Modal isOpen={showLastReceipt} onClose={() => setShowLastReceipt(false)} title="Transaksi Berhasil" size="md">
        {lastTransaction && (
          <div className="space-y-4">
            <div className="bg-emerald-50 dark:bg-emerald-900/20 rounded-xl p-4 text-center">
              <div className="w-12 h-12 bg-emerald-100 dark:bg-emerald-800 rounded-full flex items-center justify-center mx-auto mb-2">
                <Icon name="check" size={24} className="text-emerald-600 dark:text-emerald-400" />
              </div>
              <div className="text-sm text-emerald-600 dark:text-emerald-400">Pembayaran Sukses</div>
              <div className="text-2xl font-bold text-emerald-700 dark:text-emerald-300">{fmt(lastTransaction.total)}</div>
              <div className="text-xs text-emerald-500 mt-1">Kembalian: {fmt(lastTransaction.change)}</div>
            </div>
            <ReceiptPreview receipt={receipt} transaction={lastTransaction} settings={settings} />
            <div className="flex gap-2">
              <Button variant="outline" className="flex-1" onClick={() => window.print()} icon={<Icon name="print" size={14} />}>Print Struk</Button>
              <Button variant="primary" className="flex-1" onClick={() => setShowLastReceipt(false)}>Selesai</Button>
            </div>
          </div>
        )}
      </Modal>

      {/* Bottom Nav */}
      <nav className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 shrink-0">
        <div className="flex justify-around items-center py-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)}
              className={`flex flex-col items-center gap-0.5 py-2 px-3 rounded-xl transition-colors ${
                activeTab === t.id 
                  ? 'text-primary-600 dark:text-primary-400' 
                  : 'text-slate-400 dark:text-slate-500'
              }`}>
              <Icon name={t.icon} size={20} />
              <span className="text-[10px] font-medium">{t.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
